<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECTOR</title>
<meta name="description" content="VECTOR is a local-first vector drawing tool: pen paths, node editing, booleans, and type on a path.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e8eaed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="VECTOR">
<meta property="og:title" content="VECTOR">
<meta property="og:description" content="A local-first vector drawing tool: pen paths, node editing, booleans, and type on a path.">
<meta property="og:url" content="https://sergioshklr.github.io/vector/">
<meta property="og:image" content="https://sergioshklr.github.io/vector/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VECTOR">
<meta name="twitter:description" content="A local-first vector drawing tool: pen paths, node editing, booleans, and type on a path.">
<meta name="twitter:image" content="https://sergioshklr.github.io/vector/x-card.png">
<link rel="preload" href="fonts/SHKLRMonoNarrow[wght].woff2" as="font" type="font/woff2" crossorigin>
<!-- Oswald / Nunito are drawing typefaces offered in the editor (content), not UI fonts. -->
<link id="vector-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&amp;family=Oswald:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="folio/folio.css">
</head>
<body>
<main class="folio-mount" id="vector"><p class="folio-boot">VECTOR</p></main>
<script src="folio/geom.js"></script>
<script src="folio/folio.js"></script>
<script>
  (function () {
    var host = document.getElementById("vector");
    try {
      host.innerHTML = "";
      window.Folio.mount(host);
    } catch (err) {
      host.textContent = (err && err.message) || "VECTOR failed to load";
    }
  })();
</script>
</body>
</html>
